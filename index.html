<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>POS PRO | Super Market</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="css/app.css">
</head>

<body>

<header>
  🛒 POS PRO - Super Market
</header>

<nav>
  <button class="active" onclick="showPage('sales',this)">المبيعات</button>
  <button onclick="showPage('purchases',this)">المشتريات</button>
  <button onclick="showPage('stock',this)">الجرد</button>
  <button onclick="showPage('agents',this)">المندوبين</button>
  <button onclick="showPage('reports',this)">التقارير</button>
</nav>

<!-- ===== SALES ===== -->
<div id="sales" class="page">

  <div class="box">
    <h3>فاتورة بيع</h3>

    <input id="saleName" placeholder="اسم الصنف">
    <input id="salePrice" type="number" placeholder="السعر">
    <input id="saleQty" type="number" value="1">

    <button class="primary" onclick="openScanner('sale')">📷 باركود</button>
    <button class="primary" onclick="addSale()">➕ إضافة</button>

    <div id="salesList" class="list"></div>
  </div>
</div>

<!-- ===== PURCHASES ===== -->
<div id="purchases" class="page hidden">
  <div class="box">
    <h3>مشتريات</h3>

    <input id="buyName" placeholder="اسم الصنف">
    <input id="buyPrice" type="number" placeholder="السعر">
    <input id="buyQty" type="number" value="1">

    <button class="primary" onclick="openScanner('buy')">📷 باركود</button>
    <button class="primary" onclick="addPurchase()">➕ إضافة</button>

    <div id="buyList" class="list"></div>
  </div>
</div>

<!-- ===== STOCK ===== -->
<div id="stock" class="page hidden">
  <div class="box">
    <h3>جرد المخزون</h3>
    <div id="stockList" class="list"></div>
  </div>
</div>

<!-- ===== AGENTS ===== -->
<div id="agents" class="page hidden">
  <div class="box">
    <h3>المندوبين</h3>

    <input id="agentName" placeholder="اسم المندوب">
    <button class="primary" onclick="addAgent()">➕ إضافة</button>

    <div id="agentsList" class="list"></div>
  </div>
</div>

<!-- ===== REPORTS ===== -->
<div id="reports" class="page hidden">
  <div class="box">
    <h3>التقارير</h3>

    <div class="report-item">المبيعات <b id="rSales">0</b></div>
    <div class="report-item">المشتريات <b id="rBuys">0</b></div>
    <div class="report-item">الربح <b id="rNet">0</b></div>

    <button class="primary" onclick="window.print()">🖨️ طباعة</button>
  </div>
</div>

<!-- ===== BARCODE CAMERA ===== -->
<div id="scanner" class="hidden scanner">
  <video id="video"></video>
  <button class="danger" onclick="closeScanner()">❌ إغلاق</button>
</div>

<script src="js/storage.js"></script>
<script src="js/barcode.js"></script>
<script src="js/app.js"></script>

</body>
</html>
