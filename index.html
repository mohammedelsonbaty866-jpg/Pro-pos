<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>POS Pro</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{font-family:tahoma;background:#f4f6f8;margin:0}
header{background:#0d6efd;color:#fff;padding:15px;text-align:center;font-size:20px}
nav{display:flex;background:#fff;border-bottom:1px solid #ddd}
nav button{flex:1;padding:10px;border:none;background:none}
nav button.active{background:#0d6efd;color:#fff}
.box{background:#fff;margin:15px;padding:15px;border-radius:6px}
input,select,button{width:100%;padding:10px;margin-top:8px}
button.primary{background:#0d6efd;color:#fff;border:none}
.hidden{display:none}
.list div{border-bottom:1px dashed #ccc;padding:5px}
</style>
</head>

<body>

<header id="companyHeader">📊 POS Pro</header>

<nav>
<button class="active" onclick="show('sales',this)">المبيعات</button>
<button onclick="show('purchases',this)">المشتريات</button>
<button onclick="show('agents',this)">المندوبين</button>
<button onclick="show('reports',this)">التقارير</button>
<button onclick="show('settings',this)">الإعدادات</button>
</nav>

<!-- SALES -->
<div id="sales" class="box">
<h3>فاتورة بيع</h3>
<input id="saleName" placeholder="اسم الصنف">
<input id="saleQty" type="number" value="1">
<input id="salePrice" type="number" placeholder="السعر">
<select id="saleAgent"></select>
<button class="primary" onclick="addSale()">➕ إضافة</button>
<button onclick="printInvoice()">🖨️ طباعة</button>
<div id="salesList" class="list"></div>
<p>الإجمالي: <b id="salesTotal">0</b></p>
</div>

<!-- PURCHASES -->
<div id="purchases" class="box hidden">
<h3>المشتريات</h3>
<input id="buyName" placeholder="اسم الصنف">
<input id="buyQty" type="number" value="1">
<input id="buyPrice" type="number" placeholder="سعر الشراء">
<button class="primary" onclick="addPurchase()">➕ إضافة</button>
<div id="purchaseList" class="list"></div>
<p>الإجمالي: <b id="buyTotal">0</b></p>
</div>

<!-- AGENTS -->
<div id="agents" class="box hidden">
<h3>المندوبين</h3>
<input id="agentName" placeholder="اسم المندوب">
<button class="primary" onclick="addAgent()">➕ إضافة</button>
<div id="agentList" class="list"></div>
</div>

<!-- REPORTS -->
<div id="reports" class="box hidden">
<h3>التقارير</h3>
<p>إجمالي المبيعات: <b id="rSales">0</b></p>
<p>إجمالي المشتريات: <b id="rBuys">0</b></p>
<p>صافي الربح: <b id="rNet">0</b></p>
<h4>مبيعات المندوبين</h4>
<div id="agentReport"></div>
</div>

<!-- SETTINGS -->
<div id="settings" class="box hidden">
<h3>إعدادات الشركة</h3>
<input id="cName" placeholder="اسم الشركة">
<input id="cPhone" placeholder="الهاتف">
<input id="cAddress" placeholder="العنوان">
<input id="cCurrency" placeholder="العملة">
<button class="primary" onclick="saveSettings()">💾 حفظ</button>
</div>

<script>
/* ===== NAV ===== */
function show(id,b){
document.querySelectorAll('.box').forEach(x=>x.classList.add("hidden"));
document.getElementById(id).classList.remove("hidden");
document.querySelectorAll('nav button').forEach(x=>x.classList.remove("active"));
b.classList.add("active");
}

/* ===== LOAD DATA ===== */
let sales=JSON.parse(localStorage.getItem("sales")||"[]");
let buys=JSON.parse(localStorage.getItem("buys")||"[]");
let agents=JSON.parse(localStorage.getItem("agents")||"[]");
let settings=JSON.parse(localStorage.getItem("settings")||"{}");

/* ===== SETTINGS ===== */
function saveSettings(){
settings={name:cName.value,phone:cPhone.value,address:cAddress.value,currency:cCurrency.value};
localStorage.setItem("settings",JSON.stringify(settings));
applySettings();
alert("تم الحفظ");
}
function applySettings(){
if(settings.name) companyHeader.innerText="📊 "+settings.name;
}
applySettings();

/* ===== AGENTS ===== */
function addAgent(){
agents.push({name:agentName.value,total:0});
agentName.value="";
saveAll();
renderAgents();
}
function renderAgents(){
agentList.innerHTML=""; saleAgent.innerHTML="";
agents.forEach((a,i)=>{
agentList.innerHTML+=`<div>${a.name}</div>`;
saleAgent.innerHTML+=`<option value="${i}">${a.name}</option>`;
});
}
renderAgents();

/* ===== SALES ===== */
function addSale(){
let total=saleQty.value*salePrice.value;
let agent=agents[saleAgent.value];
sales.push({name:saleName.value,total,agent:saleAgent.value});
agents[saleAgent.value].total+=total;
salesList.innerHTML+=`<div>${saleName.value} = ${total}</div>`;
saveAll(); update();
}
function renderSales(){
salesList.innerHTML="";
sales.forEach(s=>salesList.innerHTML+=`<div>${s.name} = ${s.total}</div>`);
}
renderSales();

/* ===== PURCHASES ===== */
function addPurchase(){
let t=buyQty.value*buyPrice.value;
buys.push(t);
purchaseList.innerHTML+=`<div>${buyName.value} = ${t}</div>`;
saveAll(); update();
}
function renderBuys(){
purchaseList.innerHTML="";
buys.forEach(b=>purchaseList.innerHTML+=`<div>${b}</div>`);
}
renderBuys();

/* ===== REPORT ===== */
function update(){
let s=sales.reduce((a,b)=>a+b.total,0);
let b=buys.reduce((a,b)=>a+b,0);
salesTotal.innerText=s;
buyTotal.innerText=b;
rSales.innerText=s;
rBuys.innerText=b;
rNet.innerText=s-b;
agentReport.innerHTML="";
agents.forEach(a=>agentReport.innerHTML+=`<div>${a.name} : ${a.total}</div>`);
}
update();

/* ===== SAVE ===== */
function saveAll(){
localStorage.setItem("sales",JSON.stringify(sales));
localStorage.setItem("buys",JSON.stringify(buys));
localStorage.setItem("agents",JSON.stringify(agents));
}

/* ===== PRINT ===== */
function printInvoice(){
let cur=settings.currency||"";
let html=`<html><body style="font-family:tahoma;direction:rtl">
<h2>${settings.name||""}</h2><hr>`;
sales.forEach(s=>html+=`<p>${s.name} : ${s.total} ${cur}</p>`);
html+=`<h3>الإجمالي: ${salesTotal.innerText} ${cur}</h3></body></html>`;
let w=window.open("");
w.document.write(html);
w.print();
}
</script>

</body>
</html>
