<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>POS Pro</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{font-family:tahoma;background:#f4f6f8;margin:0}
header{background:#0d6efd;color:#fff;padding:15px;text-align:center}
nav{display:flex;background:#fff}
nav button{flex:1;padding:10px;border:none;background:none}
nav button.active{background:#0d6efd;color:#fff}
.box{background:#fff;margin:15px;padding:15px;border-radius:6px}
input,button{width:100%;padding:10px;margin-top:8px;font-size:15px}
button.primary{background:#0d6efd;color:#fff;border:none}
table{width:100%;border-collapse:collapse;margin-top:10px}
th,td{border:1px solid #ddd;padding:6px;text-align:center}
.hidden{display:none}
</style>
</head>

<body>

<header>📊 POS Pro</header>

<nav>
<button class="active" onclick="show('sales',this)">المبيعات</button>
<button onclick="show('purchases',this)">المشتريات</button>
<button onclick="show('stock',this)">المخزون</button>
</nav>

<!-- SALES -->
<div id="sales" class="box">
<h3>فاتورة بيع</h3>
<input id="sName" placeholder="اسم الصنف">
<input id="sQty" type="number" placeholder="الكمية">
<input id="sPrice" type="number" placeholder="السعر">
<button class="primary" onclick="addSale()">➕ إضافة بيع</button>
<table>
<tr><th>الصنف</th><th>ك</th><th>س</th><th>إ</th></tr>
<tbody id="salesList"></tbody>
</table>
<b>الإجمالي: <span id="salesTotal">0</span></b>
</div>

<!-- PURCHASES -->
<div id="purchases" class="box hidden">
<h3>إضافة مشتريات</h3>
<input id="pName" placeholder="اسم الصنف">
<input id="pQty" type="number" placeholder="الكمية">
<input id="pPrice" type="number" placeholder="سعر الشراء">
<button class="primary" onclick="addPurchase()">➕ إضافة شراء</button>
</div>

<!-- STOCK -->
<div id="stock" class="box hidden">
<h3>المخزون</h3>
<table>
<tr><th>الصنف</th><th>الكمية</th></tr>
<tbody id="stockList"></tbody>
</table>
</div>

<script>
let stock = JSON.parse(localStorage.getItem("stock")||"{}");
let sales=[];

function saveStock(){
  localStorage.setItem("stock",JSON.stringify(stock));
  renderStock();
}

function renderStock(){
  stockList.innerHTML="";
  for(let k in stock){
    stockList.innerHTML+=`<tr><td>${k}</td><td>${stock[k]}</td></tr>`;
  }
}
renderStock();

function addPurchase(){
  let n=pName.value,q=+pQty.value;
  if(!n||q<=0) return alert("بيانات خطأ");
  stock[n]=(stock[n]||0)+q;
  saveStock();
  pName.value=pQty.value=pPrice.value="";
  alert("تم إضافة للمخزون");
}

function addSale(){
  let n=sName.value,q=+sQty.value,pr=+sPrice.value;
  if(!n||q<=0||pr<=0) return alert("بيانات خطأ");
  if((stock[n]||0)<q) return alert("المخزون غير كافي");

  stock[n]-=q;
  sales.push(q*pr);
  salesList.innerHTML+=`<tr><td>${n}</td><td>${q}</td><td>${pr}</td><td>${q*pr}</td></tr>`;
  salesTotal.innerText=sales.reduce((a,b)=>a+b,0);
  saveStock();
  sName.value=sQty.value=sPrice.value="";
}

function show(id,b){
  document.querySelectorAll('.box').forEach(x=>x.classList.add("hidden"));
  document.getElementById(id).classList.remove("hidden");
  document.querySelectorAll('nav button').forEach(x=>x.classList.remove("active"));
  b.classList.add("active");
}
</script>

</body>
</html>
