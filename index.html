<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>POS Pro</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- CSS -->
  <link rel="stylesheet" href="css/app.css">
</head>

<body>

<header>
  🧾 POS Pro – نظام نقاط بيع احترافي
</header>

<nav>
  <button class="active" onclick="showPage('sales', this)">المبيعات</button>
  <button onclick="showPage('purchases', this)">المشتريات</button>
  <button onclick="showPage('agents', this)">المناديب</button>
  <button onclick="showPage('reports', this)">التقارير</button>
</nav>

<!-- ================== SALES ================== -->
<div id="sales" class="page">

  <div class="box">
    <h3>فاتورة بيع</h3>
    <input id="saleItem" placeholder="اسم الصنف">
    <input id="saleQty" type="number" placeholder="الكمية" value="1">
    <input id="salePrice" type="number" placeholder="سعر الوحدة">
    <button class="primary" onclick="addSale()">➕ إضافة</button>
  </div>

  <div class="box">
    <h3>تفاصيل الفاتورة</h3>
    <div id="salesList" class="list"></div>
    <hr>
    <p><b>الإجمالي:</b> <span id="salesTotal">0</span></p>
    <button class="primary" onclick="window.print()">🖨️ طباعة الفاتورة</button>
  </div>

</div>

<!-- ================== PURCHASES ================== -->
<div id="purchases" class="page hidden">

  <div class="box">
    <h3>مشتريات</h3>
    <input id="buyItem" placeholder="اسم الصنف">
    <input id="buyQty" type="number" placeholder="الكمية" value="1">
    <input id="buyPrice" type="number" placeholder="سعر الشراء">
    <button class="primary" onclick="addPurchase()">➕ إضافة</button>
  </div>

  <div class="box">
    <h3>سجل المشتريات</h3>
    <div id="purchaseList" class="list"></div>
  </div>

</div>

<!-- ================== AGENTS ================== -->
<div id="agents" class="page hidden">

  <div class="box">
    <h3>المناديب</h3>
    <input id="agentName" placeholder="اسم المندوب">
    <button class="primary" onclick="addAgent()">➕ إضافة مندوب</button>
  </div>

  <div class="box">
    <h3>قائمة المناديب</h3>
    <div id="agentsList" class="list"></div>
  </div>

</div>

<!-- ================== REPORTS ================== -->
<div id="reports" class="page hidden">

  <div class="box">
    <h3>التقارير</h3>

    <div class="report-item">
      <span>إجمالي المبيعات</span>
      <b id="rSales">0</b>
    </div>

    <div class="report-item">
      <span>إجمالي المشتريات</span>
      <b id="rBuys">0</b>
    </div>

    <div class="report-item">
      <span>صافي الربح</span>
      <b id="rNet">0</b>
    </div>
  </div>

</div>

<!-- ================== JS ================== -->
<script>
/* NAV */
function showPage(id, btn) {
  document.querySelectorAll('.page').forEach(p => p.classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

/* DATA */
let sales = [];
let purchases = [];
let agents = [];

/* SALES */
function addSale() {
  let qty = +saleQty.value;
  let price = +salePrice.value;
  let total = qty * price;

  sales.push(total);
  salesList.innerHTML += `<div>${saleItem.value} × ${qty} = ${total}</div>`;
  updateTotals();
}

/* PURCHASES */
function addPurchase() {
  let total = buyQty.value * buyPrice.value;
  purchases.push(total);
  purchaseList.innerHTML += `<div>${buyItem.value} = ${total}</div>`;
  updateTotals();
}

/* AGENTS */
function addAgent() {
  agents.push(agentName.value);
  agentsList.innerHTML += `<div>${agentName.value}</div>`;
  agentName.value = '';
}

/* REPORTS */
function updateTotals() {
  let s = sales.reduce((a,b)=>a+b,0);
  let p = purchases.reduce((a,b)=>a+b,0);

  salesTotal.innerText = s;
  rSales.innerText = s;
  rBuys.innerText = p;
  rNet.innerText = s - p;
}
</script>

</body>
</html>
