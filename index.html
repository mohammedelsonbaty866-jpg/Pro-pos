<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>POS Pro Ultimate</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{margin:0;font-family:tahoma;background:#f4f6f8}
header{background:#0d6efd;color:#fff;padding:15px;text-align:center}
nav{display:flex;background:#fff}
nav button{flex:1;padding:10px;border:none;background:none}
nav button.active{background:#0d6efd;color:#fff}
.box{background:#fff;margin:10px;padding:15px;border-radius:6px}
.hidden{display:none}
input,select,button{width:100%;padding:10px;margin-top:8px}
button.primary{background:#0d6efd;color:#fff;border:none}
table{width:100%;border-collapse:collapse;margin-top:10px}
th,td{border:1px solid #ccc;padding:5px;text-align:center}
</style>
</head>

<body>

<header>📊 POS Pro – النسخة الكاملة</header>

<!-- LOGIN -->
<div id="loginBox" class="box">
<h3>تسجيل الدخول</h3>
<input id="u" placeholder="اسم المستخدم">
<input id="p" type="password" placeholder="كلمة المرور">
<button class="primary" onclick="login()">دخول</button>
</div>

<!-- APP -->
<div id="app" class="hidden">

<nav>
<button class="active" onclick="show('sales',this)">مبيعات</button>
<button onclick="show('customers',this)">عملاء</button>
<button onclick="show('stock',this)">مخزون</button>
<button onclick="show('collect',this)">تحصيل</button>
<button onclick="show('reports',this)">تقارير</button>
<button onclick="logout()">خروج</button>
</nav>

<!-- SALES -->
<div id="sales" class="box">
<h3>فاتورة بيع</h3>

<select id="cust"></select>
<select id="pay">
<option value="cash">كاش</option>
<option value="credit">آجل</option>
</select>

<input id="item" placeholder="الصنف">
<input id="qty" type="number" value="1">
<input id="price" placeholder="السعر">
<button class="primary" onclick="addSale()">إضافة</button>

<div id="inv"></div>
<p><b>الإجمالي:</b> <span id="total">0</span></p>
<button class="primary" onclick="saveInvoice()">حفظ</button>
</div>

<!-- CUSTOMERS -->
<div id="customers" class="box hidden">
<h3>العملاء</h3>
<input id="cn" placeholder="اسم العميل">
<button class="primary" onclick="addCustomer()">إضافة</button>
<div id="custList"></div>
</div>

<!-- STOCK -->
<div id="stock" class="box hidden">
<h3>المخزون</h3>
<input id="sn" placeholder="اسم الصنف">
<input id="sq" type="number" placeholder="الكمية">
<button class="primary" onclick="addStock()">إضافة مخزون</button>
<div id="stockList"></div>
</div>

<!-- COLLECT -->
<div id="collect" class="box hidden">
<h3>تحصيل آجل</h3>
<select id="cCust"></select>
<input id="payAmount" type="number" placeholder="المبلغ">
<button class="primary" onclick="collect()">تحصيل</button>
</div>

<!-- REPORTS -->
<div id="reports" class="box hidden">
<h3>التقارير</h3>
<p>مبيعات: <b id="rs">0</b></p>
<p>آجل: <b id="rc">0</b></p>
<p>صافي: <b id="rn">0</b></p>
<button onclick="window.print()">🖨 طباعة</button>
</div>

</div>

<script>
const USERS=[{u:"admin",p:"1234"},{u:"agent1",p:"1234"}];
let sales=[],invoice=[],customers=JSON.parse(localStorage.customers||"[]");
let stock=JSON.parse(localStorage.stock||"[]");

function login(){
let user=USERS.find(x=>x.u===u.value&&x.p===p.value);
if(!user)return alert("خطأ");
localStorage.user=JSON.stringify(user);
start();
}
function logout(){localStorage.clear();location.reload();}
if(localStorage.user)start();

function start(){
loginBox.classList.add("hidden");
app.classList.remove("hidden");
renderCustomers();renderStock();loadCust();
}

function show(id,b){
document.querySelectorAll('.box').forEach(x=>x.classList.add("hidden"));
document.getElementById(id).classList.remove("hidden");
document.querySelectorAll('nav button').forEach(x=>x.classList.remove("active"));
b.classList.add("active");
}

// SALES
function addSale(){
let t=qty.value*price.value;
invoice.push(t);
inv.innerHTML+=`<div>${item.value} = ${t}</div>`;
total.innerText=invoice.reduce((a,b)=>a+b,0);
}

function saveInvoice(){
let t=+total.innerText;
sales.push(t);
if(pay.value==="credit"){
customers[cust.value].bal=(customers[cust.value].bal||0)+t;
}
localStorage.sales=JSON.stringify(sales);
localStorage.customers=JSON.stringify(customers);
invoice=[];inv.innerHTML="";total.innerText=0;
renderReports();
}

// CUSTOMERS
function addCustomer(){
customers.push({name:cn.value,bal:0});
localStorage.customers=JSON.stringify(customers);
renderCustomers();loadCust();
}

function renderCustomers(){
custList.innerHTML="";
customers.forEach(c=>custList.innerHTML+=`<div>${c.name} | ${c.bal||0}</div>`);
}

function loadCust(){
cust.innerHTML="";cCust.innerHTML="";
customers.forEach((c,i)=>{
cust.innerHTML+=`<option value="${i}">${c.name}</option>`;
cCust.innerHTML+=`<option value="${i}">${c.name}</option>`;
});
}

// STOCK
function addStock(){
stock.push({name:sn.value,qty:+sq.value});
localStorage.stock=JSON.stringify(stock);
renderStock();
}
function renderStock(){
stockList.innerHTML="";
stock.forEach(s=>stockList.innerHTML+=`<div>${s.name} = ${s.qty}</div>`);
}

// COLLECT
function collect(){
customers[cCust.value].bal-=+payAmount.value;
localStorage.customers=JSON.stringify(customers);
renderCustomers();renderReports();
}

// REPORTS
function renderReports(){
let s=sales.reduce((a,b)=>a+b,0);
let c=customers.reduce((a,b)=>a+(b.bal||0),0);
rs.innerText=s;rc.innerText=c;rn.innerText=s-c;
}
</script>

</body>
</html>
