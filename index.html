<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>PosPro</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="css/app.css" />

  <style>
    body {
      font-family: Tahoma;
      background: #f4f6f8;
      margin: 0;
    }
    .hidden { display: none; }
    .card {
      background: #fff;
      padding: 20px;
      margin: 20px;
      border-radius: 8px;
      box-shadow: 0 0 5px rgba(0,0,0,.1);
    }
    input, button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      font-size: 14px;
    }
    button {
      background: #0d6efd;
      color: #fff;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    nav button {
      width: auto;
      margin: 5px;
    }
  </style>
</head>

<body>

<!-- 🔐 صفحة تسجيل / دخول -->
<div id="authPage" class="card">
  <h2>تسجيل الدخول</h2>
<input id="email" placeholder="البريد الإلكتروني">
<input id="password" type="password" placeholder="كلمة المرور">

<button id="loginBtn">تسجيل دخول</button>
<button id="registerBtn">تسجيل حساب</button>

  <p id="authError" style="color:red"></p>
</div>

<!-- 🧾 التطبيق -->
<div id="appPage" class="hidden">

  <nav class="card">
    <button onclick="showSection('sales')">المبيعات</button>
    <button onclick="showSection('purchases')">المشتريات</button>
    <button onclick="showSection('expenses')">المصروفات</button>
    <button onclick="showSection('reports')">التقارير</button>
    <button onclick="logout()">خروج</button>
  </nav>

  <!-- المبيعات -->
  <div id="sales" class="card section">
    <h3>فاتورة بيع</h3>
    <input id="saleItem" placeholder="اسم الصنف" />
    <input id="saleQty" type="number" placeholder="الكمية" />
    <input id="salePrice" type="number" placeholder="السعر" />
    <button onclick="addSale()">حفظ الفاتورة</button>
  </div>

  <!-- المشتريات -->
  <div id="purchases" class="card section hidden">
    <h3>فاتورة شراء</h3>
    <input id="purchaseItem" placeholder="الصنف" />
    <input id="purchaseQty" type="number" placeholder="الكمية" />
    <input id="purchasePrice" type="number" placeholder="السعر" />
    <button onclick="addPurchase()">حفظ</button>
  </div>

  <!-- المصروفات -->
  <div id="expenses" class="card section hidden">
    <h3>مصروف</h3>
    <input id="expenseDesc" placeholder="الوصف" />
    <input id="expenseAmount" type="number" placeholder="المبلغ" />
    <button onclick="addExpense()">إضافة</button>
  </div>

  <!-- التقارير -->
  <div id="reports" class="card section hidden">
    <h3>التقارير</h3>
    <button onclick="loadReports()">عرض التقرير</button>
    <div id="reportResult"></div>
  </div>

</div>

<!-- 🔌 JS Files -->
<script type="module" src="js/firebase.js"></script>
<script type="module" src="js/auth.js"></script>
<script type="module" src="js/app.js"></script>

</body>
</html>
