<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>POS Pro | سوبر ماركت</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- CSS -->
<link rel="stylesheet" href="css/style.css">

</head>
<body>

<header class="header">
  <h1>POS Pro</h1>
  <span class="shop-name">سوبر ماركت</span>
</header>

<nav class="nav">
  <button onclick="App.show('sales')" class="active">المبيعات</button>
  <button onclick="App.show('purchases')">المشتريات</button>
  <button onclick="App.show('stock')">المخزون</button>
  <button onclick="App.show('agents')">المناديب</button>
  <button onclick="App.show('reports')">التقارير</button>
</nav>

<main>

  <!-- SALES -->
  <section id="sales" class="screen">
    <h2>فاتورة بيع</h2>

    <select id="saleAgent"></select>
    <input id="saleName" placeholder="اسم الصنف">
    <input id="saleQty" type="number" placeholder="الكمية">
    <input id="salePrice" type="number" placeholder="سعر البيع">

    <button class="primary" onclick="Sales.add()">إضافة بيع</button>

    <table>
      <thead>
        <tr>
          <th>المندوب</th>
          <th>الصنف</th>
          <th>الكمية</th>
          <th>الإجمالي</th>
        </tr>
      </thead>
      <tbody id="salesTable"></tbody>
    </table>

    <div class="total">
      إجمالي المبيعات: <span id="salesTotal">0</span>
    </div>
  </section>

  <!-- PURCHASES -->
  <section id="purchases" class="screen hidden">
    <h2>المشتريات</h2>

    <input id="buyName" placeholder="اسم الصنف">
    <input id="buyQty" type="number" placeholder="الكمية">
    <input id="buyCost" type="number" placeholder="سعر الشراء">

    <button class="primary" onclick="Purchases.add()">إضافة شراء</button>
  </section>

  <!-- STOCK -->
  <section id="stock" class="screen hidden">
    <h2>المخزون</h2>

    <table>
      <thead>
        <tr>
          <th>الصنف</th>
          <th>الكمية</th>
          <th>تكلفة الشراء</th>
        </tr>
      </thead>
      <tbody id="stockTable"></tbody>
    </table>
  </section>

  <!-- AGENTS -->
  <section id="agents" class="screen hidden">
    <h2>المناديب</h2>

    <input id="agentName" placeholder="اسم المندوب">
    <button class="primary" onclick="Agents.add()">إضافة مندوب</button>

    <table>
      <thead>
        <tr>
          <th>المندوب</th>
          <th>إجمالي المبيعات</th>
        </tr>
      </thead>
      <tbody id="agentsTable"></tbody>
    </table>
  </section>

  <!-- REPORTS -->
  <section id="reports" class="screen hidden">
    <h2>التقارير</h2>

    <p>إجمالي المبيعات: <b id="reportSales">0</b></p>
    <p>إجمالي التكلفة: <b id="reportCost">0</b></p>
    <p>صافي الربح: <b id="reportNet">0</b></p>

    <h3>مبيعات حسب المندوب</h3>
    <table>
      <thead>
        <tr>
          <th>المندوب</th>
          <th>الإجمالي</th>
        </tr>
      </thead>
      <tbody id="reportAgents"></tbody>
    </table>
  </section>

</main>

<!-- JS -->
<script src="js/data.js"></script>
<script src="js/stock.js"></script>
<script src="js/purchases.js"></script>
<script src="js/sales.js"></script>
<script src="js/agents.js"></script>
<script src="js/reports.js"></script>
<script src="js/app.js"></script>

</body>
</html>
