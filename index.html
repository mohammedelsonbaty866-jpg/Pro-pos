<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>PosPro</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Firebase v8 -->
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

  <!-- App -->
  <link rel="stylesheet" href="css/app.css" />
  <script defer src="js/firebase.js"></script>
  <script defer src="js/auth.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Tahoma, Arial;
      background: #f4f6f8;
    }

    header {
      background: #0d6efd;
      color: #fff;
      padding: 15px;
      font-size: 18px;
      text-align: center;
    }

    nav {
      display: flex;
      background: #ffffff;
      border-bottom: 1px solid #ddd;
    }

    nav button {
      flex: 1;
      padding: 12px;
      border: none;
      background: none;
      font-size: 14px;
      cursor: pointer;
    }

    nav button.active {
      background: #0d6efd;
      color: #fff;
    }

    .container {
      padding: 15px;
    }

    .box {
      background: #fff;
      padding: 15px;
      margin-bottom: 12px;
      border-radius: 6px;
    }
  </style>
</head>

<body>

<header>
  PosPro – نظام محاسبي سحابي
</header>

<nav>
  <button class="active" onclick="showSection('dashboard', this)">الرئيسية</button>
  <button onclick="showSection('sales', this)">المبيعات</button>
  <button onclick="showSection('purchases', this)">المشتريات</button>
  <button onclick="showSection('expenses', this)">المصروفات</button>
  <button onclick="showSection('reports', this)">التقارير</button>
  <button onclick="showSection('settings', this)">الإعدادات</button>
</nav>

<div class="container">

  <div id="dashboard" class="box">
    <h3>مرحبًا 👋</h3>
    <p>نظام PosPro يعمل أونلاين وبدون إنترنت.</p>
  </div>

  <div id="sales" class="box" style="display:none">
    <h3>🧾 المبيعات</h3>
    <p>سيتم إضافة الفواتير هنا.</p>
  </div>

  <div id="purchases" class="box" style="display:none">
    <h3>📦 المشتريات</h3>
    <p>إدارة فواتير الشراء.</p>
  </div>

  <div id="expenses" class="box" style="display:none">
    <h3>💸 المصروفات</h3>
    <p>تسجيل المصروفات اليومية.</p>
  </div>

  <div id="reports" class="box" style="display:none">
    <h3>📊 التقارير</h3>
    <p>تقارير الأرباح والمبيعات.</p>
  </div>

  <div id="settings" class="box" style="display:none">
    <h3>⚙️ الإعدادات</h3>
    <button onclick="logout()">تسجيل الخروج</button>
  </div>

</div>

<script>
  function showSection(id, btn) {
    document.querySelectorAll(".box").forEach(d => d.style.display = "none");
    document.getElementById(id).style.display = "block";

    document.querySelectorAll("nav button").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
  }

  // حماية الصفحة
  firebase.auth().onAuthStateChanged(user => {
    if (!user) {
      window.location.href = "login.html";
    }
  });
</script>

</body>
</html>
