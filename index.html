<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>POS Pro</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root{
--main:#0d6efd;
--bg:#f4f6f8;
--card:#ffffff;
}
*{box-sizing:border-box}
body{font-family:tahoma;background:var(--bg);margin:0}
header{
background:var(--main);
color:#fff;
padding:16px;
text-align:center;
font-size:20px;
font-weight:bold
}
.box{
background:var(--card);
margin:12px;
padding:15px;
border-radius:8px;
box-shadow:0 2px 6px rgba(0,0,0,.08)
}
input,select,button{
width:100%;
padding:10px;
margin-top:8px;
font-size:14px;
border-radius:6px;
border:1px solid #ccc
}
button.primary{
background:var(--main);
color:#fff;
border:none;
font-weight:bold
}
nav{
display:flex;
flex-wrap:wrap;
background:#fff;
border-bottom:1px solid #ddd
}
nav button{
flex:1;
padding:10px;
border:none;
background:none;
font-weight:bold;
font-size:14px
}
nav button.active{
background:var(--main);
color:#fff
}
.hidden{display:none}
.stat{
display:flex;
justify-content:space-between;
padding:6px 0;
border-bottom:1px dashed #ddd
}
.stat b{color:var(--main)}
@media print{
nav,button{display:none}
}
</style>
</head>

<body>

<header>POS Pro – نظام نقاط بيع</header>

<!-- LOGIN -->
<div id="loginBox" class="box">
<h3>تسجيل الدخول</h3>
<input id="loginEmail" placeholder="البريد الإلكتروني">
<input id="loginPass" type="password" placeholder="كلمة المرور">
<button class="primary" onclick="login()">دخول</button>
</div>

<!-- APP -->
<div id="app" class="hidden">

<nav>
<button class="active" onclick="showPage('sales',this)">المبيعات</button>
<button onclick="showPage('purchases',this)">المشتريات</button>
<button onclick="showPage('stock',this)">المخزون</button>
<button onclick="showPage('reports',this)">التقارير</button>
<button onclick="logout()">خروج</button>
</nav>

<!-- SALES -->
<div id="sales" class="box">
<h3>فاتورة بيع</h3>
<select id="saleItem"></select>
<input id="saleQty" type="number" min="1" value="1">
<button class="primary" onclick="addSale()">إضافة بيع</button>
</div>

<!-- PURCHASE -->
<div id="purchases" class="box hidden">
<h3>إضافة مشتريات</h3>
<select id="buyItem"></select>
<input id="buyQty" type="number" min="1" placeholder="الكمية">
<input id="buyPrice" type="number" min="0" placeholder="سعر الشراء">
<button class="primary" onclick="addPurchase()">حفظ المشتريات</button>
</div>

<!-- STOCK -->
<div id="stock" class="box hidden">
<h3>المخزون</h3>
<div id="stockList"></div>
</div>

<!-- REPORTS -->
<div id="reports" class="box hidden">
<h3>التقارير</h3>
<div class="stat">إجمالي المبيعات <b id="rSales">0</b></div>
<div class="stat">إجمالي المشتريات <b id="rBuys">0</b></div>
<div class="stat">صافي الربح <b id="rNet">0</b></div>
<button class="primary" onclick="window.print()">🖨️ طباعة التقرير</button>
</div>

</div>

<script>
// ================= AUTH =================
const USER={email:"admin@pos.com",pass:"1234"};

function login(){
if(loginEmail.value===USER.email && loginPass.value===USER.pass){
localStorage.setItem("logged","1");
startApp();
}else{
alert("بيانات الدخول غير صحيحة");
}
}

function logout(){
localStorage.clear();
location.reload();
}

function startApp(){
loginBox.classList.add("hidden");
app.classList.remove("hidden");
renderAll();
}

if(localStorage.getItem("logged")==="1") startApp();

// ================= DATA =================
let stock = JSON.parse(localStorage.getItem("stock")) || [
{name:"منتج 1",qty:50,sell:10,buy:7},
{name:"منتج 2",qty:30,sell:15,buy:10}
];

let sales = JSON.parse(localStorage.getItem("sales")) || [];
let buys  = JSON.parse(localStorage.getItem("buys"))  || [];

// ================= NAV =================
function showPage(id,btn){
document.querySelectorAll('#app .box').forEach(b=>b.classList.add("hidden"));
document.getElementById(id).classList.remove("hidden");
document.querySelectorAll('nav button').forEach(b=>b.classList.remove("active"));
btn.classList.add("active");
}

// ================= SALES =================
function addSale(){
let i = saleItem.value;
let q = Number(saleQty.value);
if(q<=0) return;
if(stock[i].qty < q) return alert("الكمية غير متوفرة في المخزون");
let total = q * stock[i].sell;
stock[i].qty -= q;
sales.push(total);
saveAll();
renderAll();
}

// ================= PURCHASE =================
function addPurchase(){
let i = buyItem.value;
let q = Number(buyQty.value);
let p = Number(buyPrice.value);
if(q<=0 || p<=0) return;
stock[i].qty += q;
stock[i].buy = p;
buys.push(q*p);
saveAll();
renderAll();
}

// ================= RENDER =================
function renderAll(){
saleItem.innerHTML = "";
buyItem.innerHTML  = "";
stock.forEach((s,i)=>{
saleItem.innerHTML += `<option value="${i}">${s.name}</option>`;
buyItem.innerHTML  += `<option value="${i}">${s.name}</option>`;
});

stockList.innerHTML="";
stock.forEach(s=>{
stockList.innerHTML += `<div class="stat">${s.name}<b>${s.qty}</b></div>`;
});

let totalSales = sales.reduce((a,b)=>a+b,0);
let totalBuys  = buys.reduce((a,b)=>a+b,0);

rSales.innerText = totalSales;
rBuys.innerText  = totalBuys;
rNet.innerText   = totalSales - totalBuys;
}

// ================= SAVE =================
function saveAll(){
localStorage.setItem("stock",JSON.stringify(stock));
localStorage.setItem("sales",JSON.stringify(sales));
localStorage.setItem("buys",JSON.stringify(buys));
}
</script>

</body>
</html>
