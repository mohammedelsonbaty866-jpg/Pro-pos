<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>POS Pro</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{font-family:tahoma;background:#f4f6f8;margin:0}
header{background:#0d6efd;color:#fff;padding:15px;text-align:center}
.box{background:#fff;margin:15px;padding:15px;border-radius:6px}
input,select,button{width:100%;padding:10px;margin-top:8px;font-size:15px}
button.primary{background:#0d6efd;color:#fff;border:none}
nav{display:flex;background:#fff}
nav button{flex:1;padding:10px;border:none;background:none}
nav button.active{background:#0d6efd;color:#fff}
.hidden{display:none}
.list div{padding:6px 0;border-bottom:1px solid #eee}
.invoice{border:1px dashed #999;padding:10px;margin-top:10px}
.summary{background:#eef3ff;padding:10px;border-radius:5px;margin-top:10px}
@media print{
nav,header,button,select,input{display:none}
body{background:#fff}
}
</style>
</head>

<body>

<header>📊 POS Pro</header>

<!-- LOGIN -->
<div id="loginBox" class="box">
<h3>تسجيل الدخول</h3>
<input id="loginEmail" placeholder="البريد الإلكتروني">
<input id="loginPass" type="password" placeholder="كلمة المرور">
<button class="primary" onclick="login()">دخول</button>
</div>

<!-- APP -->
<div id="app" class="hidden">

<nav>
<button class="active" onclick="show('sales',this)">المبيعات</button>
<button onclick="show('purchases',this)">المشتريات</button>
<button onclick="show('expenses',this)">المصروفات</button>
<button onclick="show('reports',this)">التقارير</button>
<button onclick="logout()">خروج</button>
</nav>

<!-- SALES -->
<div id="sales" class="box">
<h3>🧾 فاتورة بيع</h3>
<input id="saleName" placeholder="اسم الصنف">
<input id="saleQty" type="number" value="1">
<input id="salePrice" type="number" placeholder="السعر">
<button class="primary" onclick="addSale()">➕ إضافة</button>

<div id="invoiceBox" class="invoice hidden">
<h4>فاتورة بيع</h4>
<p>رقم: <b id="invId"></b></p>
<p>التاريخ: <b id="invDate"></b></p>
<p>المندوب: <b id="invAgent"></b></p>
<hr>
<div id="invItems"></div>
<hr>
<p>الإجمالي: <b id="invTotal"></b></p>
<button onclick="window.print()">🖨️ طباعة</button>
</div>
</div>

<!-- PURCHASES -->
<div id="purchases" class="box hidden">
<h3>📦 المشتريات</h3>
<input id="pName" placeholder="اسم الصنف">
<input id="pQty" type="number" placeholder="الكمية">
<input id="pCost" type="number" placeholder="سعر الشراء">
<button class="primary" onclick="addPurchase()">➕ إضافة</button>
<div id="purchaseList" class="list"></div>
</div>

<!-- EXPENSES -->
<div id="expenses" class="box hidden">
<h3>💸 المصروفات</h3>
<select id="expType">
<option>إيجار</option>
<option>كهرباء</option>
<option>مياه</option>
<option>مرتبات</option>
<option>أخرى</option>
</select>
<input id="expNote" placeholder="وصف المصروف">
<input id="expAmount" type="number" placeholder="المبلغ">
<button class="primary" onclick="addExpense()">➕ تسجيل</button>
<div id="expenseList" class="list"></div>
</div>

<!-- REPORTS -->
<div id="reports" class="box hidden">
<h3>📊 التقارير</h3>

<div class="summary">
<p>إجمالي المبيعات: <b id="rSales">0</b></p>
<p>إجمالي المشتريات: <b id="rBuys">0</b></p>
<p>إجمالي المصروفات: <b id="rExp">0</b></p>
<p>🟢 صافي الربح: <b id="rNet">0</b></p>
</div>

<hr>
<h4>📦 المخزون</h4>
<div id="stockList"></div>
</div>

</div>

<script>
// ===== USERS =====
const USERS=[
{id:"admin",email:"admin@pos.com",pass:"1234",role:"admin",name:"المدير"},
{id:"a1",email:"agent1",pass:"1234",role:"agent",name:"مندوب 1"}
];

let current=null;

// ===== AUTH =====
function login(){
let u=USERS.find(x=>x.email===loginEmail.value && x.pass===loginPass.value);
if(!u) return alert("بيانات غير صحيحة");
localStorage.setItem("user",JSON.stringify(u));
start();
}
function logout(){localStorage.clear();location.reload();}
function start(){
current=JSON.parse(localStorage.getItem("user"));
loginBox.classList.add("hidden");
app.classList.remove("hidden");
renderReports();
}
if(localStorage.getItem("user")) start();

// ===== DATA =====
let sales=JSON.parse(localStorage.getItem("sales")||"[]");
let purchases=JSON.parse(localStorage.getItem("purchases")||"[]");
let expenses=JSON.parse(localStorage.getItem("expenses")||"[]");
let products=JSON.parse(localStorage.getItem("products")||"[]");
let currentInvoice=[];

// ===== NAV =====
function show(id,b){
document.querySelectorAll('#app .box').forEach(x=>x.classList.add("hidden"));
document.getElementById(id).classList.remove("hidden");
document.querySelectorAll('nav button').forEach(x=>x.classList.remove("active"));
b.classList.add("active");
}

// ===== SALES =====
function addSale(){
let prod=products.find(p=>p.name===saleName.value);
if(!prod||prod.qty<saleQty.value) return alert("مخزون غير كافي");

let total=saleQty.value*salePrice.value;
prod.qty-=saleQty.value;

currentInvoice.push({name:saleName.value,qty:saleQty.value,total});
renderInvoice();
}

function renderInvoice(){
invoiceBox.classList.remove("hidden");
invId.innerText=Date.now();
invDate.innerText=new Date().toLocaleString('ar-EG');
invAgent.innerText=current.name;

invItems.innerHTML="";
let sum=0;
currentInvoice.forEach(i=>{
sum+=i.total;
invItems.innerHTML+=`<div>${i.name} × ${i.qty} = ${i.total}</div>`;
});
invTotal.innerText=sum;

sales.push({agent:current.id,total:sum});
save();renderReports();
}

// ===== PURCHASES =====
function addPurchase(){
let p=products.find(x=>x.name===pName.value);
p?p.qty+=+pQty.value:products.push({name:pName.value,qty:+pQty.value});
purchases.push(+pCost.value * +pQty.value);
purchaseList.innerHTML+=`<div>${pName.value}</div>`;
save();renderReports();
}

// ===== EXPENSES =====
function addExpense(){
expenses.push({type:expType.value,amount:+expAmount.value});
expenseList.innerHTML+=`<div>${expType.value} - ${expAmount.value}</div>`;
expAmount.value="";expNote.value="";
save();renderReports();
}

// ===== REPORTS =====
function renderReports(){
let mySales=sales.filter(s=>current.role==="admin"||s.agent===current.id);
let s=mySales.reduce((a,b)=>a+b.total,0);
let b=purchases.reduce((a,b)=>a+b,0);
let e=expenses.reduce((a,b)=>a+b.amount,0);

rSales.innerText=s;
rBuys.innerText=b;
rExp.innerText=e;
rNet.innerText=s-b-e;

stockList.innerHTML="";
products.forEach(p=>stockList.innerHTML+=`<div>${p.name} : ${p.qty}</div>`);
}

// ===== SAVE =====
function save(){
localStorage.setItem("sales",JSON.stringify(sales));
localStorage.setItem("purchases",JSON.stringify(purchases));
localStorage.setItem("expenses",JSON.stringify(expenses));
localStorage.setItem("products",JSON.stringify(products));
}
</script>

</body>
</html>
