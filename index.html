<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>POS Pro</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root{
  --main:#0d6efd;
  --bg:#f4f6f8;
  --card:#fff;
}
body{margin:0;font-family:tahoma;background:var(--bg)}
header{background:var(--main);color:#fff;padding:15px;text-align:center}
nav{display:flex;background:#fff;border-bottom:1px solid #ddd}
nav button{flex:1;padding:12px;border:none;background:none}
nav button.active{background:var(--main);color:#fff}
.container{padding:15px}
.card{background:var(--card);padding:15px;border-radius:6px;margin-bottom:15px}
.hidden{display:none}
input,button{width:100%;padding:10px;margin-top:8px}
button.primary{background:var(--main);color:#fff;border:none}
table{width:100%;border-collapse:collapse;margin-top:10px}
th,td{border:1px solid #ddd;padding:6px;text-align:center}
.total{font-size:18px;font-weight:bold}
</style>
</head>

<body>

<header>🧾 POS Pro</header>

<!-- LOGIN -->
<div id="loginBox" class="container">
  <div class="card">
    <h3>تسجيل الدخول</h3>
    <input id="loginUser" placeholder="اسم المستخدم">
    <input id="loginPass" type="password" placeholder="كلمة المرور">
    <button class="primary" onclick="login()">دخول</button>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden">

<nav>
  <button class="active" onclick="showSection('sales',this)">المبيعات</button>
  <button onclick="showSection('invoices',this)">الفاتورة</button>
  <button onclick="logout()">خروج</button>
</nav>

<div class="container">

<!-- SALES -->
<div id="sales" class="card">
  <h3>إضافة صنف</h3>
  <input id="itemName" placeholder="اسم الصنف">
  <input id="itemQty" type="number" value="1" placeholder="الكمية">
  <input id="itemPrice" type="number" placeholder="السعر">
  <button class="primary" onclick="addItem()">➕ إضافة للفاتورة</button>
</div>

<!-- INVOICE -->
<div id="invoices" class="card hidden">
  <h3>فاتورة البيع</h3>

  <table>
    <thead>
      <tr>
        <th>الصنف</th>
        <th>كمية</th>
        <th>سعر</th>
        <th>الإجمالي</th>
      </tr>
    </thead>
    <tbody id="invoiceBody"></tbody>
  </table>

  <p class="total">الإجمالي: <span id="grandTotal">0</span> ج</p>

  <button class="primary" onclick="printInvoice()">🖨️ طباعة الفاتورة</button>
</div>

</div>
</div>

<script>
// ===== LOGIN =====
const USER={user:"admin",pass:"1234"};
function login(){
  if(loginUser.value===USER.user && loginPass.value===USER.pass){
    localStorage.setItem("logged","1");
    startApp();
  }else alert("بيانات غير صحيحة");
}
function logout(){
  localStorage.removeItem("logged");
  location.reload();
}
function startApp(){
  loginBox.classList.add("hidden");
  app.classList.remove("hidden");
}
if(localStorage.getItem("logged")==="1") startApp();

// ===== NAV =====
function showSection(id,btn){
  document.querySelectorAll('.card').forEach(c=>c.classList.add("hidden"));
  document.getElementById(id).classList.remove("hidden");
  document.querySelectorAll('nav button').forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
}

// ===== SALES =====
let invoice=[];
function addItem(){
  const name=itemName.value;
  const qty=+itemQty.value;
  const price=+itemPrice.value;
  if(!name||!price) return alert("اكمل البيانات");

  invoice.push({name,qty,price});
  renderInvoice();
  itemName.value="";
  itemQty.value=1;
  itemPrice.value="";
}

function renderInvoice(){
  invoiceBody.innerHTML="";
  let total=0;
  invoice.forEach(i=>{
    const t=i.qty*i.price;
    total+=t;
    invoiceBody.innerHTML+=`
      <tr>
        <td>${i.name}</td>
        <td>${i.qty}</td>
        <td>${i.price}</td>
        <td>${t}</td>
      </tr>`;
  });
  grandTotal.innerText=total;
}

// ===== PRINT =====
function printInvoice(){
  let html=`<h3>فاتورة بيع</h3><table border="1" width="100%">
  <tr><th>الصنف</th><th>كمية</th><th>سعر</th><th>إجمالي</th></tr>`;
  let total=0;
  invoice.forEach(i=>{
    let t=i.qty*i.price;
    total+=t;
    html+=`<tr><td>${i.name}</td><td>${i.qty}</td><td>${i.price}</td><td>${t}</td></tr>`;
  });
  html+=`</table><h3>الإجمالي: ${total}</h3>`;

  let w=window.open("");
  w.document.write(html);
  w.print();
  w.close();
}
</script>

</body>
</html>
