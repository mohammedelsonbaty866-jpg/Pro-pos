<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>PosPro</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0d6efd" />

  <style>
    body {
      font-family: Tahoma, Arial;
      margin: 0;
      background: #f4f6f8;
    }

    header {
      background: #0d6efd;
      color: #fff;
      padding: 15px;
      text-align: center;
      font-size: 18px;
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      background: #fff;
      border-bottom: 1px solid #ddd;
    }

    nav button {
      flex: 1;
      padding: 10px;
      border: none;
      background: none;
      font-size: 14px;
    }

    nav button.active {
      background: #0d6efd;
      color: #fff;
    }

    .container {
      padding: 15px;
    }

    .box {
      background: #fff;
      padding: 15px;
      margin-bottom: 10px;
      border-radius: 5px;
    }

    input, select, button {
      width: 100%;
      padding: 10px;
      margin-top: 8px;
      font-size: 14px;
    }

    button.primary {
      background: #0d6efd;
      color: #fff;
      border: none;
    }

    .center {
      text-align: center;
      margin-top: 100px;
    }
  </style>
</head>

<body>

<!-- صفحة تسجيل الدخول -->
<div id="loginPage" class="center">
  <h2>تسجيل الدخول</h2>
  <input type="email" id="loginEmail" placeholder="البريد الإلكتروني" />
  <input type="password" id="loginPassword" placeholder="كلمة المرور" />
  <button onclick="loginUser()">دخول</button>
</div>

<!-- التطبيق -->
<div id="app" style="display:none">

  <header>PosPro</header>

  <nav>
    <button class="active" onclick="showSection('dashboard',this)">الرئيسية</button>
    <button onclick="showSection('sales',this)">المبيعات</button>
    <button onclick="showSection('purchases',this)">المشتريات</button>
    <button onclick="showSection('expenses',this)">المصروفات</button>
    <button onclick="showSection('reports',this)">التقارير</button>
    <button onclick="showSection('settings',this)">الإعدادات</button>
    <button onclick="logout()">خروج</button>
  </nav>

  <div class="container">

    <!-- الرئيسية -->
    <div id="dashboard" class="box">
      <h3>👋 مرحبًا بك</h3>
      <p>نظام PosPro لإدارة المبيعات والمحاسبة</p>
    </div>

    <!-- المبيعات -->
    <div id="sales" class="box" style="display:none">
      <h3>🧾 المبيعات</h3>
      <input placeholder="اسم الصنف">
      <input type="number" placeholder="الكمية">
      <input type="number" placeholder="السعر">
      <button class="primary">حفظ فاتورة</button>
      <div id="salesList"></div>
    </div>

    <!-- المشتريات -->
    <div id="purchases" class="box" style="display:none">
      <h3>📦 المشتريات</h3>
      <input placeholder="اسم المورد / الصنف">
      <input type="number" placeholder="الكمية">
      <input type="number" placeholder="سعر الشراء">
      <button class="primary">حفظ شراء</button>
      <div id="purchasesList"></div>
    </div>

    <!-- المصروفات -->
    <div id="expenses" class="box" style="display:none">
      <h3>💸 المصروفات</h3>
      <select>
        <option>إيجار</option>
        <option>كهرباء</option>
        <option>رواتب</option>
        <option>أخرى</option>
      </select>
      <input type="number" placeholder="المبلغ">
      <button class="primary">إضافة مصروف</button>
      <div id="expensesList"></div>
    </div>

    <!-- التقارير -->
    <div id="reports" class="box" style="display:none">
      <h3>📊 التقارير</h3>
      <input type="date">
      <input type="date">
      <button>تقرير المبيعات</button>
      <button>صافي الربح</button>
      <div id="reportsResult"></div>
    </div>

    <!-- الإعدادات -->
    <div id="settings" class="box" style="display:none">
      <h3>⚙️ الإعدادات</h3>
      <input placeholder="اسم النشاط">
      <input placeholder="اسم المستخدم">
      <select>
        <option>بدون ضريبة</option>
        <option>تفعيل الضريبة</option>
      </select>
      <button class="primary">حفظ الإعدادات</button>
    </div>

  </div>
</div>

<!-- Firebase Modules -->
<script type="module">
  import "./js/firebase.js";
  import "./js/auth.js";
  import "./js/app.js";
</script>

</body>
</html>
