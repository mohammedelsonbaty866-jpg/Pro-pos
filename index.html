<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>POS Pro - Offline</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{margin:0;font-family:tahoma;background:#f4f6f8}
header{background:#0d6efd;color:#fff;padding:15px;text-align:center}
nav{display:flex;background:#fff;border-bottom:1px solid #ddd}
nav button{flex:1;padding:12px;border:none;background:none}
nav button.active{background:#0d6efd;color:#fff}
.box{background:#fff;margin:15px;padding:15px;border-radius:6px}
.hidden{display:none}
input,select,button{width:100%;padding:10px;margin-top:8px}
button.primary{background:#0d6efd;color:#fff;border:none}
table{width:100%;border-collapse:collapse;margin-top:10px}
th,td{border:1px solid #ccc;padding:6px;text-align:center}
.total{font-size:18px;font-weight:bold;margin-top:10px}
@media print{
  nav,header,button{display:none}
}
</style>
</head>

<body>

<header>📊 POS Pro (Offline)</header>

<nav>
<button class="active" onclick="show('sales',this)">مبيعات</button>
<button onclick="show('purchases',this)">مشتريات</button>
<button onclick="show('agents',this)">مندوبين</button>
<button onclick="show('stock',this)">مخزون</button>
<button onclick="show('reports',this)">تقارير</button>
</nav>

<!-- SALES -->
<div id="sales" class="box">
<h3>فاتورة بيع</h3>

<select id="agentSelect"></select>

<input id="itemName" placeholder="الصنف">
<input id="itemQty" type="number" value="1">
<input id="itemPrice" type="number" placeholder="السعر">
<button class="primary" onclick="addSale()">➕ إضافة</button>

<table>
<thead><tr><th>الصنف</th><th>كمية</th><th>سعر</th><th>إجمالي</th></tr></thead>
<tbody id="saleBody"></tbody>
</table>

<div class="total">الإجمالي: <span id="saleTotal">0</span></div>
<button class="primary" onclick="saveInvoice()">💾 حفظ</button>
<button onclick="window.print()">🖨️ طباعة</button>
</div>

<!-- PURCHASES -->
<div id="purchases" class="box hidden">
<h3>مشتريات</h3>
<input id="buyName" placeholder="الصنف">
<input id="buyQty" type="number" value="1">
<button class="primary" onclick="addPurchase()">إضافة للمخزون</button>
</div>

<!-- AGENTS -->
<div id="agents" class="box hidden">
<h3>المندوبين</h3>
<input id="agentName" placeholder="اسم المندوب">
<button class="primary" onclick="addAgent()">إضافة</button>
<ul id="agentList"></ul>
</div>

<!-- STOCK -->
<div id="stock" class="box hidden">
<h3>المخزون</h3>
<ul id="stockList"></ul>
</div>

<!-- REPORTS -->
<div id="reports" class="box hidden">
<h3>التقارير</h3>
<p>إجمالي المبيعات: <b id="rSales">0</b></p>
<p>عدد الفواتير: <b id="rCount">0</b></p>
</div>

<script>
// ===== DATA =====
let sales=[], invoices=JSON.parse(localStorage.invoices||"[]");
let agents=JSON.parse(localStorage.agents||'["مندوب عام"]');
let stock=JSON.parse(localStorage.stock||"{}");

// ===== UI =====
function show(id,b){
 document.querySelectorAll('.box').forEach(x=>x.classList.add("hidden"));
 document.getElementById(id).classList.remove("hidden");
 document.querySelectorAll('nav button').forEach(x=>x.classList.remove("active"));
 b.classList.add("active");
}

// ===== AGENTS =====
function loadAgents(){
 agentSelect.innerHTML="";
 agentList.innerHTML="";
 agents.forEach(a=>{
  agentSelect.innerHTML+=`<option>${a}</option>`;
  agentList.innerHTML+=`<li>${a}</li>`;
 });
 localStorage.agents=JSON.stringify(agents);
}
function addAgent(){
 agents.push(agentName.value);
 agentName.value="";
 loadAgents();
}
loadAgents();

// ===== SALES =====
function addSale(){
 let t=itemQty.value*itemPrice.value;
 sales.push(t);
 saleBody.innerHTML+=`<tr><td>${itemName.value}</td><td>${itemQty.value}</td><td>${itemPrice.value}</td><td>${t}</td></tr>`;
 saleTotal.innerText=sales.reduce((a,b)=>a+b,0);
}

// ===== SAVE INVOICE =====
function saveInvoice(){
 invoices.push({
  agent:agentSelect.value,
  total:+saleTotal.innerText,
  date:new Date().toLocaleString()
 });
 localStorage.invoices=JSON.stringify(invoices);
 sales=[];saleBody.innerHTML="";saleTotal.innerText=0;
 alert("تم الحفظ");
 renderReports();
}

// ===== PURCHASE =====
function addPurchase(){
 stock[buyName.value]=(stock[buyName.value]||0)+(+buyQty.value);
 localStorage.stock=JSON.stringify(stock);
 renderStock();
}

// ===== STOCK =====
function renderStock(){
 stockList.innerHTML="";
 for(let i in stock){
  stockList.innerHTML+=`<li>${i} : ${stock[i]}</li>`;
 }
}
renderStock();

// ===== REPORTS =====
function renderReports(){
 rSales.innerText=invoices.reduce((a,b)=>a+b.total,0);
 rCount.innerText=invoices.length;
}
renderReports();
</script>

</body>
</html>
