<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>POS Pro</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root{
  --main:#0d6efd;
  --bg:#f4f6f8;
  --card:#fff;
}
body{margin:0;font-family:tahoma;background:var(--bg)}
header{background:var(--main);color:#fff;padding:15px;text-align:center}
nav{display:flex;background:#fff;border-bottom:1px solid #ddd}
nav button{flex:1;padding:12px;border:none;background:none}
nav button.active{background:var(--main);color:#fff}
.container{padding:15px}
.card{background:var(--card);padding:15px;border-radius:6px;margin-bottom:15px}
.hidden{display:none}
input,select,button{width:100%;padding:10px;margin-top:8px}
button.primary{background:var(--main);color:#fff;border:none}
table{width:100%;border-collapse:collapse;margin-top:10px}
th,td{border:1px solid #ddd;padding:6px;text-align:center}
.total{font-size:18px;font-weight:bold}
</style>
</head>

<body>

<header>📦 POS Pro</header>

<!-- LOGIN -->
<div id="loginBox" class="container">
  <div class="card">
    <h3>تسجيل الدخول</h3>
    <input id="loginUser" placeholder="اسم المستخدم">
    <input id="loginPass" type="password" placeholder="كلمة المرور">
    <button class="primary" onclick="login()">دخول</button>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden">

<nav>
  <button class="active" onclick="showSection('sales',this)">المبيعات</button>
  <button onclick="showSection('invoice',this)">الفاتورة</button>
  <button onclick="showSection('stock',this)">المخزون</button>
  <button onclick="showSection('inventory',this)">الجرد</button>
  <button onclick="logout()">خروج</button>
</nav>

<div class="container">

<!-- SALES -->
<div id="sales" class="card">
  <h3>إضافة صنف</h3>
  <input id="itemName" placeholder="اسم الصنف">
  <input id="itemQty" type="number" value="1">
  <input id="itemPrice" type="number" placeholder="السعر">
  <select id="itemUnit">
    <option>قطعة</option>
    <option>كرتونة</option>
    <option>كيلو</option>
  </select>
  <button class="primary" onclick="addItem()">➕ إضافة للفاتورة</button>
</div>

<!-- INVOICE -->
<div id="invoice" class="card hidden">
  <h3>فاتورة البيع</h3>
  <table>
    <thead>
      <tr>
        <th>الصنف</th>
        <th>كمية</th>
        <th>وحدة</th>
        <th>سعر</th>
        <th>إجمالي</th>
      </tr>
    </thead>
    <tbody id="invoiceBody"></tbody>
  </table>
  <p class="total">الإجمالي: <span id="grandTotal">0</span> ج</p>
  <button class="primary" onclick="printInvoice()">🖨️ طباعة</button>
</div>

<!-- STOCK -->
<div id="stock" class="card hidden">
  <h3>المخزون</h3>
  <table>
    <thead>
      <tr>
        <th>الصنف</th>
        <th>الكمية</th>
        <th>الوحدة</th>
      </tr>
    </thead>
    <tbody id="stockBody"></tbody>
  </table>
</div>

<!-- INVENTORY -->
<div id="inventory" class="card hidden">
  <h3>جرد المخزن</h3>
  <button class="primary" onclick="runInventory()">📋 تنفيذ الجرد</button>
  <div id="inventoryResult"></div>
</div>

</div>
</div>

<script>
// ===== LOGIN =====
const USER={user:"admin",pass:"1234"};
function login(){
  if(loginUser.value===USER.user && loginPass.value===USER.pass){
    localStorage.setItem("logged","1");
    startApp();
  }else alert("بيانات غير صحيحة");
}
function logout(){localStorage.removeItem("logged");location.reload();}
function startApp(){loginBox.classList.add("hidden");app.classList.remove("hidden");}
if(localStorage.getItem("logged")==="1") startApp();

// ===== NAV =====
function showSection(id,btn){
  document.querySelectorAll('.card').forEach(c=>c.classList.add("hidden"));
  document.getElementById(id).classList.remove("hidden");
  document.querySelectorAll('nav button').forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
}

// ===== DATA =====
let invoice=[];
let stock={};

// ===== SALES =====
function addItem(){
  let name=itemName.value;
  let qty=+itemQty.value;
  let price=+itemPrice.value;
  let unit=itemUnit.value;
  if(!name||!price) return alert("اكمل البيانات");

  invoice.push({name,qty,price,unit});
  stock[name]=(stock[name]||0)-qty;

  renderInvoice();
  renderStock();

  itemName.value="";itemQty.value=1;itemPrice.value="";
}

function renderInvoice(){
  invoiceBody.innerHTML="";
  let total=0;
  invoice.forEach(i=>{
    let t=i.qty*i.price;
    total+=t;
    invoiceBody.innerHTML+=`
      <tr>
        <td>${i.name}</td>
        <td>${i.qty}</td>
        <td>${i.unit}</td>
        <td>${i.price}</td>
        <td>${t}</td>
      </tr>`;
  });
  grandTotal.innerText=total;
}

// ===== STOCK =====
function renderStock(){
  stockBody.innerHTML="";
  Object.keys(stock).forEach(k=>{
    stockBody.innerHTML+=`
      <tr>
        <td>${k}</td>
        <td>${stock[k]}</td>
        <td>-</td>
      </tr>`;
  });
}

// ===== INVENTORY =====
function runInventory(){
  inventoryResult.innerHTML="<h4>نتيجة الجرد:</h4>";
  Object.keys(stock).forEach(k=>{
    inventoryResult.innerHTML+=`<div>${k} : ${stock[k]}</div>`;
  });
}

// ===== PRINT =====
function printInvoice(){
  let w=window.open("");
  w.document.write(document.getElementById("invoice").innerHTML);
  w.print();
  w.close();
}
</script>

</body>
</html>
