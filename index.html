<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>POS Pro</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{--main:#0d6efd;--bg:#f4f6f8}
body{margin:0;font-family:tahoma;background:var(--bg)}
header{background:var(--main);color:#fff;padding:15px;text-align:center}
nav{display:flex;background:#fff;border-bottom:1px solid #ddd}
nav button{flex:1;padding:12px;border:none;background:none}
nav button.active{background:var(--main);color:#fff}
.container{padding:15px}
.card{background:#fff;padding:15px;border-radius:6px;margin-bottom:15px}
.hidden{display:none}
input,select,button{width:100%;padding:10px;margin-top:8px}
button.primary{background:var(--main);color:#fff;border:none}
table{width:100%;border-collapse:collapse}
th,td{border:1px solid #ddd;padding:6px;text-align:center}
.total{font-size:18px;font-weight:bold}
</style>
</head>

<body>

<header>📊 POS Pro</header>

<!-- LOGIN -->
<div id="loginBox" class="container">
  <div class="card">
    <h3>تسجيل الدخول</h3>
    <input id="loginUser" placeholder="اسم المستخدم">
    <input id="loginPass" type="password" placeholder="كلمة المرور">
    <button class="primary" onclick="login()">دخول</button>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden">

<nav id="navBar"></nav>

<div class="container">

<!-- SALES -->
<div id="sales" class="card">
<h3>فاتورة بيع</h3>
<input id="itemName" placeholder="اسم الصنف">
<input id="itemQty" type="number" value="1">
<input id="itemPrice" type="number" placeholder="السعر">
<button class="primary" onclick="addItem()">➕ إضافة</button>

<table>
<thead>
<tr><th>الصنف</th><th>كمية</th><th>سعر</th><th>إجمالي</th></tr>
</thead>
<tbody id="invoiceBody"></tbody>
</table>

<p class="total">الإجمالي: <span id="grandTotal">0</span> ج</p>
<button class="primary" onclick="printInvoice()">🖨️ طباعة</button>
</div>

<!-- REPORTS -->
<div id="reports" class="card hidden">
<h3>تقارير المبيعات</h3>
<div id="reportList"></div>
</div>

</div>
</div>

<script>
// ===== USERS =====
const USERS=[
 {u:"admin",p:"1234",role:"admin"},
 {u:"agent1",p:"1234",role:"agent"},
 {u:"agent2",p:"1234",role:"agent"}
];

let currentUser=null;
let invoice=[];
let allInvoices=JSON.parse(localStorage.getItem("invoices")||"[]");

// ===== LOGIN =====
function login(){
  let u=loginUser.value;
  let p=loginPass.value;
  let user=USERS.find(x=>x.u===u && x.p===p);
  if(!user) return alert("بيانات غير صحيحة");
  currentUser=user;
  localStorage.setItem("user",JSON.stringify(user));
  startApp();
}

function startApp(){
  loginBox.classList.add("hidden");
  app.classList.remove("hidden");
  buildNav();
  renderReports();
}

function logout(){
  localStorage.removeItem("user");
  location.reload();
}

let saved=localStorage.getItem("user");
if(saved){currentUser=JSON.parse(saved);startApp();}

// ===== NAV =====
function buildNav(){
  navBar.innerHTML="";
  navBar.innerHTML+=`<button class="active" onclick="show('sales',this)">المبيعات</button>`;
  if(currentUser.role==="admin"){
    navBar.innerHTML+=`<button onclick="show('reports',this)">التقارير</button>`;
  }
  navBar.innerHTML+=`<button onclick="logout()">خروج</button>`;
}

function show(id,btn){
  document.querySelectorAll('.card').forEach(x=>x.classList.add("hidden"));
  document.getElementById(id).classList.remove("hidden");
  document.querySelectorAll('nav button').forEach(x=>x.classList.remove("active"));
  btn.classList.add("active");
}

// ===== SALES =====
function addItem(){
  let name=itemName.value;
  let qty=+itemQty.value;
  let price=+itemPrice.value;
  if(!name||!price)return alert("اكمل البيانات");

  invoice.push({name,qty,price});
  renderInvoice();
  itemName.value="";itemQty.value=1;itemPrice.value="";
}

function renderInvoice(){
  invoiceBody.innerHTML="";
  let total=0;
  invoice.forEach(i=>{
    let t=i.qty*i.price;
    total+=t;
    invoiceBody.innerHTML+=`
    <tr>
      <td>${i.name}</td>
      <td>${i.qty}</td>
      <td>${i.price}</td>
      <td>${t}</td>
    </tr>`;
  });
  grandTotal.innerText=total;
}

function printInvoice(){
  allInvoices.push({
    agent:currentUser.u,
    total:+grandTotal.innerText,
    date:new Date().toLocaleString()
  });
  localStorage.setItem("invoices",JSON.stringify(allInvoices));
  window.print();
  invoice=[];renderInvoice();
}

// ===== REPORTS =====
function renderReports(){
  if(currentUser.role!=="admin")return;
  reportList.innerHTML="";
  allInvoices.forEach(i=>{
    reportList.innerHTML+=`
      <div>مندوب: ${i.agent} | ${i.total} ج | ${i.date}</div>`;
  });
}
</script>

</body>
</html>
