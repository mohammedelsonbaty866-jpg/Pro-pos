<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>POS Pro - فواتير</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{font-family:tahoma;background:#f4f6f8;margin:0}
header{background:#0d6efd;color:#fff;padding:15px;text-align:center}
.box{background:#fff;margin:15px;padding:15px;border-radius:6px}
input,button{width:100%;padding:10px;margin-top:8px;font-size:15px}
button.primary{background:#0d6efd;color:#fff;border:none}
table{width:100%;margin-top:10px;border-collapse:collapse}
th,td{border:1px solid #ddd;padding:8px;text-align:center}
th{background:#eee}
.total{font-size:18px;font-weight:bold;margin-top:10px}
</style>
</head>

<body>

<header>🧾 POS Pro - فواتير بيع</header>

<div class="box">
  <h3>إضافة صنف</h3>
  <input id="itemName" placeholder="اسم الصنف">
  <input id="itemQty" type="number" placeholder="الكمية" value="1">
  <input id="itemPrice" type="number" placeholder="السعر">
  <button class="primary" onclick="addItem()">➕ إضافة</button>
</div>

<div class="box">
  <h3>الفاتورة</h3>
  <table>
    <thead>
      <tr>
        <th>الصنف</th>
        <th>الكمية</th>
        <th>السعر</th>
        <th>الإجمالي</th>
      </tr>
    </thead>
    <tbody id="invoiceItems"></tbody>
  </table>

  <div class="total">الإجمالي: <span id="invoiceTotal">0</span></div>

  <button class="primary" onclick="saveInvoice()">💾 حفظ الفاتورة</button>
  <button onclick="printInvoice()">🖨️ طباعة</button>
</div>

<div class="box">
  <h3>الفواتير المحفوظة</h3>
  <div id="savedInvoices"></div>
</div>

<script>
let invoice = [];
let invoices = JSON.parse(localStorage.getItem("invoices") || "[]");

function addItem(){
  const name = itemName.value;
  const qty = +itemQty.value;
  const price = +itemPrice.value;
  if(!name || qty<=0 || price<=0) return alert("بيانات غير صحيحة");

  invoice.push({name,qty,price});
  renderInvoice();
  itemName.value="";
  itemQty.value=1;
  itemPrice.value="";
}

function renderInvoice(){
  let html="", total=0;
  invoice.forEach(i=>{
    const t=i.qty*i.price;
    total+=t;
    html+=`<tr>
      <td>${i.name}</td>
      <td>${i.qty}</td>
      <td>${i.price}</td>
      <td>${t}</td>
    </tr>`;
  });
  invoiceItems.innerHTML=html;
  invoiceTotal.innerText=total;
}

function saveInvoice(){
  if(invoice.length===0) return alert("الفاتورة فاضية");
  invoices.push({
    date:new Date().toLocaleString("ar-EG"),
    items:invoice,
    total:invoiceTotal.innerText
  });
  localStorage.setItem("invoices",JSON.stringify(invoices));
  invoice=[];
  renderInvoice();
  loadInvoices();
  alert("تم حفظ الفاتورة");
}

function loadInvoices(){
  savedInvoices.innerHTML="";
  invoices.forEach((inv,i)=>{
    savedInvoices.innerHTML+=`
      <div style="border-bottom:1px solid #ddd;padding:5px">
        🧾 فاتورة #${i+1} - ${inv.date} - الإجمالي: ${inv.total}
      </div>`;
  });
}
loadInvoices();

function printInvoice(){
  window.print();
}
</script>

</body>
</html>
