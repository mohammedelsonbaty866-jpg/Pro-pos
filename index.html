<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>Pos Pro</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">

  <!-- CSS -->
  <link rel="stylesheet" href="css/app.css">
</head>

<body>

<header class="header">
  <h1>🧾 Pos Pro</h1>
  <span>سوبر ماركت</span>
</header>

<nav class="nav">
  <button onclick="showSection('sales')" class="active">المبيعات</button>
  <button onclick="showSection('purchases')">المشتريات</button>
  <button onclick="showSection('inventory')">المخزون</button>
  <button onclick="showSection('agents')">المناديب</button>
  <button onclick="showSection('expenses')">المصروفات</button>
  <button onclick="showSection('reports')">التقارير</button>
</nav>

<main class="container">

  <!-- المبيعات -->
  <section id="sales" class="box">
    <h2>🧾 فاتورة بيع</h2>

    <input id="saleItem" placeholder="اسم الصنف">
    <input id="saleQty" type="number" placeholder="الكمية" value="1">
    <input id="salePrice" type="number" placeholder="السعر">

    <button class="primary" onclick="addSale()">➕ إضافة</button>

    <div id="salesList"></div>

    <div class="total">
      الإجمالي: <span id="salesTotal">0</span>
    </div>

    <button onclick="printInvoice()">🖨️ طباعة الفاتورة</button>
  </section>

  <!-- المشتريات -->
  <section id="purchases" class="box hidden">
    <h2>📦 مشتريات</h2>

    <input id="buyItem" placeholder="اسم الصنف">
    <input id="buyQty" type="number" value="1">
    <input id="buyPrice" type="number" placeholder="سعر الشراء">

    <button class="primary" onclick="addPurchase()">➕ إضافة</button>

    <div id="purchaseList"></div>
  </section>

  <!-- المخزون -->
  <section id="inventory" class="box hidden">
    <h2>📊 المخزون</h2>
    <div id="inventoryList"></div>
  </section>

  <!-- المناديب -->
  <section id="agents" class="box hidden">
    <h2>👤 المناديب</h2>

    <input id="agentName" placeholder="اسم المندوب">
    <button class="primary" onclick="addAgent()">➕ إضافة مندوب</button>

    <div id="agentsList"></div>
  </section>

  <!-- المصروفات -->
  <section id="expenses" class="box hidden">
    <h2>💸 المصروفات</h2>

    <input id="expenseDesc" placeholder="الوصف">
    <input id="expenseAmount" type="number" placeholder="المبلغ">

    <button class="primary" onclick="addExpense()">➕ إضافة</button>

    <div id="expensesList"></div>
  </section>

  <!-- التقارير -->
  <section id="reports" class="box hidden">
    <h2>📈 التقارير</h2>

    <p>إجمالي المبيعات: <b id="reportSales">0</b></p>
    <p>إجمالي المشتريات: <b id="reportPurchases">0</b></p>
    <p>إجمالي المصروفات: <b id="reportExpenses">0</b></p>
    <p>صافي الربح: <b id="reportNet">0</b></p>
  </section>

</main>

<!-- JS -->
<script src="js/data.js"></script>
<script src="js/sales.js"></script>
<script src="js/purchases.js"></script>
<script src="js/inventory.js"></script>
<script src="js/agents.js"></script>
<script src="js/expenses.js"></script>
<script src="js/reports.js"></script>
<script src="js/app.js"></script>

<!-- Service Worker -->
<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("service-worker.js");
}
</script>

</body>
</html>
